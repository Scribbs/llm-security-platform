<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Security Assessment Platform</title>
    <style>
      :root {
        --bg: #0f1419;
        --surface: #1a2332;
        --border: #2d3a4f;
        --text: #e7ecf3;
        --muted: #8b9bb4;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --danger: #ef4444;
        --success: #22c55e;
        --warning: #f59e0b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
      }
      a { color: var(--accent); text-decoration: none; }
      button {
        cursor: pointer;
        border: none;
        border-radius: 6px;
        padding: 0.6rem 1.2rem;
        font-weight: 500;
        background: var(--accent);
        color: white;
        transition: background 0.15s;
      }
      button:hover { background: var(--accent-hover); }
      button.secondary { background: var(--surface); border: 1px solid var(--border); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      input, select, textarea {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 0.5rem 0.75rem;
        width: 100%;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.25rem;
      }
      .badge {
        display: inline-block;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
      }
      .badge.pending { background: #334155; color: #94a3b8; }
      .badge.running { background: #1e3a5f; color: #60a5fa; }
      .badge.completed { background: #14532d; color: #4ade80; }
      .badge.failed { background: #7f1d1d; color: #f87171; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
